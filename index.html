<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6a00"><title>Impresiones 3D AGB</title><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body>
<header><img src="./logo.png" alt="AGB"><div><b>Impresiones 3D AGB</b><small>Calculadora de costos y presupuestos</small></div></header>
<nav><button data-view="quote" class="active">Cotizar</button><button data-view="history">Historial</button><button data-view="settings">Configuración</button></nav>
<main>
<section id="quote" class="view active"><div class="top"><button id="newQuote">＋ Nueva cotización</button><input id="name" value="Cotización rápida" aria-label="Nombre"></div>
<div class="card blue"><h2>1. Impresión</h2><div class="grid"><label>Material<select id="material"></select></label><label>Datos de Bambu<select id="bambuMode"><option>Por unidad</option><option>Lote completo</option></select></label><label>Peso Bambu (g)<input id="weight" type="number" min="0" step="0.1" value="0"></label><div class="time-row"><label>Horas<input id="hours" type="number" min="0" step="1" value="0"></label><label>Minutos<input id="minutes" type="number" min="0" max="59" step="1" value="0"></label></div><label>Cantidad<input id="qty" type="number" min="1" step="1" value="1"></label><label>Colores<input id="colors" type="number" min="1" step="1" value="1"></label></div></div>
<div class="card green"><h2>2. Trabajo y diseño</h2><div class="grid"><label>Tipo de diseño<select id="designType"><option>Sin diseño propio</option><option>Diseño exclusivo</option><option>Diseño reutilizable</option></select></label><label>Diseño CAD (h)<input id="cad" type="number" min="0" step="0.1" value="0"></label><label>Unidades amortización<input id="amortUnits" type="number" min="1" step="1" value="1"></label><label>Preparación / laminado (h)<input id="prep" type="number" min="0" step="0.1" value="0"></label><label>Postprocesado (h)<input id="post" type="number" min="0" step="0.1" value="0"></label><label>Armado (h)<input id="assembly" type="number" min="0" step="0.1" value="0"></label></div></div>
<div class="card orange"><h2>3. Insumos extras</h2><div class="grid"><label>Packaging ($)<input id="packaging" type="number" min="0" value="0"></label><label>Tornillos / insertos ($)<input id="hardware" type="number" min="0" value="0"></label><label>Pegamento ($)<input id="glue" type="number" min="0" value="0"></label><label>Otros ($)<input id="other" type="number" min="0" value="0"></label></div></div>
<div class="card yellow"><h2>4. Precio de venta</h2><div class="grid"><label>Multiplicador<select id="mult"><option>x1</option><option>x2</option><option>x3</option><option>x4</option><option selected>x5</option></select></label><label>Categoría<select id="category"></select></label><label>Piso comercial manual ($)<input id="manualFloor" type="number" min="0" value="0"></label><label>Factor de lote<select id="lotFactor"><option value="auto">Automático</option><option value="1">100%</option><option value="0.9">90%</option><option value="0.8">80%</option><option value="0.7">70%</option><option value="0.6">60%</option><option value="0.5">50%</option></select><small id="factorHint"></small></label><label>Precio lote manual ($)<input id="manualLot" type="number" min="0" value="0"></label></div></div>
<div class="card result"><h2>Resultado</h2><div id="summary"></div><div class="calc-price"><span>Precio por cálculo / unidad</span><strong id="calcUnitPrice">$ 0</strong></div><div class="price"><span>Precio final lote</span><strong id="finalLot">$ 0</strong><small id="finalUnit">$ 0 / unidad</small></div><div class="actions"><button id="save">Guardar cotización</button><button id="budget">Presupuesto</button></div></div></section>
<section id="history" class="view"><h1>Historial</h1><div id="historyList"></div></section>
<section id="settings" class="view"><h1>Configuración</h1><div class="card"><div class="grid" id="settingsGrid"></div><div class="actions"><button id="saveSettings">Guardar configuración</button><button id="resetSettings" class="secondary">Restablecer valores</button></div></div><h2>Materiales</h2><div id="materialsSettings"></div><h2>Pisos comerciales</h2><div id="floorsSettings"></div></section>
</main>
<dialog id="budgetDialog"><div id="budgetCard"></div><div class="actions"><button id="shareImage">Compartir imagen</button><button id="printPdf">Guardar / imprimir PDF</button><button id="closeBudget" class="secondary">Cerrar</button></div></dialog>
<script src="app.js"></script></body></html>
